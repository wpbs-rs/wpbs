[package]
name = "wpbs"
description = "WASM plugin based services."
version = "0.1.0-rc.4"
authors = ["Eduard Smet <contact@celarye.dev>"]
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
cron = "0.17.0"
dotenvy = "0.15.7"
fjall = "3.1.8"
futures-util = "0.3.33"
hashbrown = "0.17.1"
hotpath = "0.23.1"
reqwest = { version = "0.13.4", features = ["hickory-dns"] }
rustls = "0.23.42"
semver = "1.0.28"
serde = "1.0.229"
sonic-rs = "0.5.8"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
twilight-cache-inmemory = { git = "https://github.com/wpbs-rs/twilight/" }
twilight-gateway = { git = "https://github.com/wpbs-rs/twilight/", features = [
  "simd-json",
] }
twilight-http = { git = "https://github.com/wpbs-rs/twilight/", features = [
  "simd-json",
  "hickory",
] }
twilight-model = { git = "https://github.com/wpbs-rs/twilight/" }
url = "2.5.8"
uuid = "1.24.0"
wasm-pkg-client = { version = "0.16.0", default-features = false }
wasmtime = "47.0.2"
wasmtime-wasi = "47.0.2"
wasmtime-wasi-http = "47.0.2"
yaml_serde = "0.10.4"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
